<svg xmlns="http://www.w3.org/2000/svg" width="600" height="436" viewBox="0 0 600 436" role="img" aria-labelledby="t d">
<title id="t">PSA 评级壳六个检查点（示意图）</title>
<desc id="d">左侧是简化的评级壳轮廓，右侧列出六个检查点：一 标签信息与官网一致；二 标签对着强光能透出背面文字；三 倾斜时 Lighthouse 全息标会出现或隐藏图案；四 背面 QR 码可用官方 App 扫描；五 壳边缘没有白雾、裂纹、缝隙或胶痕；六 壳体坚硬不晃，按压边缘不会发出声音或弹开。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1f2328}.muted{fill:#57606a}.w{fill:#fff}</style>
<rect width="600" height="436" fill="#f6f8fa"/>
<text x="24" y="28" font-size="16" font-weight="700">评级壳六个检查点</text>
<text x="24" y="48" font-size="11" class="muted">Six checkpoints on a PSA holder. Study diagram based on PSA guidance, not a photo.</text>
<rect x="40" y="66" width="190" height="320" rx="12" fill="#e9edf1" stroke="#8c959f" stroke-width="2"/>
<rect x="52" y="78" width="166" height="58" rx="4" fill="#fff" stroke="#b3001b" stroke-width="3"/>
<text x="62" y="96" font-size="10">年份 系列 · 卡名</text>
<text x="62" y="112" font-size="10">编号 · 版本</text>
<text x="208" y="104" font-size="11" font-weight="700" text-anchor="end">GEM MT 10</text>
<text x="208" y="126" font-size="10" text-anchor="end">12345678</text>
<rect x="118" y="116" width="26" height="14" rx="3" fill="#c8d1dc"/>
<rect x="80" y="152" width="110" height="210" rx="6" fill="#fff" stroke="#d0d7de"/>
<text x="135" y="262" font-size="12" text-anchor="middle" class="muted">卡片</text>
<g font-size="12" font-weight="700">
<circle cx="52" cy="78" r="11" fill="#b3001b"/><text x="52" y="82" text-anchor="middle" class="w">1</text>
<circle cx="218" cy="136" r="11" fill="#b3001b"/><text x="218" y="140" text-anchor="middle" class="w">2</text>
<circle cx="131" cy="140" r="11" fill="#b3001b"/><text x="131" y="144" text-anchor="middle" class="w">3</text>
<circle cx="230" cy="80" r="11" fill="#b3001b"/><text x="230" y="84" text-anchor="middle" class="w">4</text>
<circle cx="40" cy="250" r="11" fill="#b3001b"/><text x="40" y="254" text-anchor="middle" class="w">5</text>
<circle cx="230" cy="330" r="11" fill="#b3001b"/><text x="230" y="334" text-anchor="middle" class="w">6</text>
</g>
<g font-size="12">
<text x="262" y="84" font-weight="700">① 标签内容 = 官网记录</text>
<text x="262" y="102" class="muted">卡名、系列、编号、等级、认证号逐字一致</text>
<text x="262" y="134" font-weight="700">② 对强光看标签厚度</text>
<text x="262" y="152" class="muted">真标签能隐约透出另一面的字；贴了假面会太厚</text>
<text x="262" y="184" font-weight="700">③ Lighthouse 全息标（2017 年后的标签）</text>
<text x="262" y="202" class="muted">左右倾斜，PSA 标志会显出或隐去背景图案</text>
<text x="262" y="234" font-weight="700">④ 背面 QR 码</text>
<text x="262" y="252" class="muted">用 PSA 官方 App 扫描，结果应跳到同一认证号</text>
<text x="262" y="284" font-weight="700">⑤ 壳边缘：白雾、裂纹、缝隙、胶痕</text>
<text x="262" y="302" class="muted">焊缝被破坏后边缘常出现「白雾」frosting</text>
<text x="262" y="334" font-weight="700">⑥ 手感：坚硬、不晃、不响</text>
<text x="262" y="352" class="muted">焊开过的壳会变软，按边缘可能发出声音或弹开</text>
</g>
<text x="24" y="406" font-size="11" class="muted">依据：PSA「PSA Security: A Buyer's Guide」与 2017 年标签说明。</text>
<text x="24" y="424" font-size="11" class="muted">旧款标签没有③，不能单凭有没有全息标下结论。</text>
</svg>
