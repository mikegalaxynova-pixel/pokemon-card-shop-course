<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="t d">
<title id="t">古物商许可与开店步骤示意图</title>
<desc id="d">六个步骤的开店路线图：许可、资金、选址、入货记录、收银与库存、开业。强调必须先取得许可，且营业所地址与许可申请绑定。</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#1f2328}
  .muted{fill:#57606a}
  .w{fill:#fff}
  .accent{fill:#b3001b}
</style>

<rect width="600" height="230" fill="#f6f8fa"/>
<text x="24" y="28" font-size="16" font-weight="700">西新宿开店路线图</text>
<text x="24" y="48" font-size="11" class="muted">Permit first. Address and license are tied together.</text>
<rect x="24" y="70" width="86" height="86" rx="10" fill="#fff" stroke="#b3001b" stroke-width="2"/>
    <text x="67" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#b3001b">1</text>
    <text x="67" y="122" font-size="11" font-weight="700" text-anchor="middle">许可</text>
    <text x="67" y="140" font-size="10" class="muted" text-anchor="middle">Permit</text>
    <rect x="118" y="70" width="86" height="86" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="161" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#b3001b">2</text>
    <text x="161" y="122" font-size="11" font-weight="700" text-anchor="middle">资金</text>
    <text x="161" y="140" font-size="10" class="muted" text-anchor="middle">Funds</text>
    <rect x="212" y="70" width="86" height="86" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="255" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#b3001b">3</text>
    <text x="255" y="122" font-size="11" font-weight="700" text-anchor="middle">选址</text>
    <text x="255" y="140" font-size="10" class="muted" text-anchor="middle">Location</text>
    <rect x="306" y="70" width="86" height="86" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="349" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#b3001b">4</text>
    <text x="349" y="122" font-size="11" font-weight="700" text-anchor="middle">入货记录</text>
    <text x="349" y="140" font-size="10" class="muted" text-anchor="middle">Records</text>
    <rect x="400" y="70" width="86" height="86" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="443" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#b3001b">5</text>
    <text x="443" y="122" font-size="11" font-weight="700" text-anchor="middle">收银库存</text>
    <text x="443" y="140" font-size="10" class="muted" text-anchor="middle">POS</text>
    <rect x="494" y="70" width="86" height="86" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <text x="537" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#b3001b">6</text>
    <text x="537" y="122" font-size="11" font-weight="700" text-anchor="middle">开业</text>
    <text x="537" y="140" font-size="10" class="muted" text-anchor="middle">Open</text>
    
<text x="24" y="182" font-size="12">营业所地址要写进申请书，所以选址和许可是绑在一起的。</text>
<text x="24" y="202" font-size="12">许可下来之前，不能以古物商身份营业。</text>
<text x="24" y="220" font-size="11" class="muted">示意图。具体以警視庁、新宿警察署的最新说明为准。</text>

</svg>
