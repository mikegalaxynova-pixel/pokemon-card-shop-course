<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="t d">
<title id="t">高额 PSA 交易检查点示意图</title>
<desc id="d">高额交易前先核验认证号与实物，当场书面记录，优先银行转账，卡片不要离开视线，并约定查看与交付方式。金额门槛由店铺自定，不是法定统一标准。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1f2328}.muted{fill:#57606a}</style>
<rect width="600" height="250" fill="#f6f8fa"/>
<text x="24" y="28" font-size="16" font-weight="700">高额交易：把速度放慢，把记录做全</text>
<text x="24" y="48" font-size="11" class="muted">The yen threshold is your shop rule, not a statutory line. Prefer bank transfer. Keep the card in sight.</text>
<g font-size="12">
  <rect x="24" y="64" width="270" height="70" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="40" y="90" font-weight="700">核验</text>
  <text x="40" y="110" font-size="12">认证号、壳标、卡面当场对照</text>
  <rect x="306" y="64" width="270" height="70" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="322" y="90" font-weight="700">付款</text>
  <text x="322" y="110" font-size="12">优先银行转账，少收大额现金</text>
  <rect x="24" y="144" width="270" height="70" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="40" y="170" font-weight="700">记录</text>
  <text x="40" y="190" font-size="12">台账、交易备忘、必要时拍照</text>
  <rect x="306" y="144" width="270" height="70" rx="8" fill="#fff" stroke="#0b5cad"/>
  <text x="322" y="170" font-weight="700">保管</text>
  <text x="322" y="190" font-size="12">卡片不离视线，预约当面交割</text>
</g>
</svg>
