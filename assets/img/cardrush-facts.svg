<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="t d">
<title id="t">卡片拉什公司公开事实示意图</title>
<desc id="d">依据株式会社RUSH官网：2015年1月15日设立，首都圈通贩加都内多家实体店，2024年5月时员工280名。本图是事实卡片，不是店面照片。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1f2328}.muted{fill:#57606a}</style>
<rect width="600" height="250" fill="#f6f8fa"/>
<text x="24" y="28" font-size="16" font-weight="700">カードラッシュ（Card Rush）公开事实</text>
<text x="24" y="48" font-size="11" class="muted">Sourced from corp.cardrush.co.jp. This is a fact card, not a storefront photo.</text>
<rect x="24" y="64" width="270" height="72" rx="8" fill="#fff" stroke="#d0d7de"/>
<text x="40" y="90" font-size="13" font-weight="700">运营公司：株式会社RUSH</text>
<text x="40" y="110" font-size="12">设立 2015年1月15日</text>
<text x="40" y="128" font-size="11" class="muted">资本金 7,000,000 日元（官网）</text>
<rect x="306" y="64" width="270" height="72" rx="8" fill="#fff" stroke="#d0d7de"/>
<text x="322" y="90" font-size="13" font-weight="700">都内实体店 + 通贩</text>
<text x="322" y="110" font-size="12">官网写明都内 5 处店铺</text>
<text x="322" y="128" font-size="11" class="muted">点名秋叶原 0/1/2 号店和池袋店</text>
<rect x="24" y="148" width="270" height="72" rx="8" fill="#fff" stroke="#d0d7de"/>
<text x="40" y="174" font-size="13" font-weight="700">员工 280 名</text>
<text x="40" y="194" font-size="12">官网标注：2024年5月現在</text>
<text x="40" y="212" font-size="11" class="muted">规模不能直接照搬到以 PSA 评级卡为主的小店</text>
<rect x="306" y="148" width="270" height="72" rx="8" fill="#fff" stroke="#d0d7de"/>
<text x="322" y="174" font-size="13" font-weight="700">已取得古物商许可</text>
<text x="322" y="194" font-size="12">东京都公安委员会许可号已公示</text>
<text x="322" y="212" font-size="11" class="muted">第301031505687号（官网）</text>
</svg>
