<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">Pop Report 读法示意图</title>
<desc id="d">用假想数字说明 Population Report 各等级数量的读法：只统计 PSA 评出的数量，不含未送评卡和其他公司，拆壳重评可能重复计数。</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#1f2328}
  .muted{fill:#57606a}
  .w{fill:#fff}
  .accent{fill:#b3001b}
</style>

<rect width="600" height="300" fill="#f6f8fa"/>
<text x="24" y="28" font-size="16" font-weight="700">Pop Report 怎么读（示意图）</text>
<text x="24" y="48" font-size="11" class="muted">Fictional example numbers — not a real card’s population</text>
<rect x="24" y="62" width="552" height="130" rx="8" fill="#fff" stroke="#d0d7de"/>
<text x="36" y="84" font-size="12" font-weight="700">示例卡 A（示意图，数字是假想的）</text>
<line x1="36" y1="94" x2="560" y2="94" stroke="#d0d7de"/>
<text x="36" y="116" font-size="12" class="muted">等级</text>
<text x="160" y="116" font-size="12" class="muted">8</text>
<text x="260" y="116" font-size="12" class="muted">9</text>
<text x="360" y="116" font-size="12" class="muted">10</text>
<text x="36" y="140" font-size="13">Pop（张）</text>
<text x="160" y="140" font-size="16" font-weight="700">80</text>
<text x="260" y="140" font-size="16" font-weight="700">40</text>
<text x="360" y="140" font-size="16" font-weight="700" fill="#b3001b">8</text>
<text x="36" y="172" font-size="12" class="muted">只表示 PSA 自己评出的数量，不是全世界的存量。</text>
<text x="24" y="220" font-size="13">意味着什么</text>
<text x="24" y="242" font-size="12">• 不含未送评的裸卡，也不含 BGS / CGC 评过的卡。</text>
<text x="24" y="262" font-size="12">• 拆壳重评有可能被重复计数。</text>
<text x="24" y="282" font-size="12">• 10 分少不一定贵，还要看这张卡有没有人要。</text>

</svg>
