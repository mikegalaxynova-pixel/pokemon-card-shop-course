<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="t d">
<title id="t">店头收购流程示意图</title>
<desc id="d">许可办妥后，店头收购依次为：只在营业所或对方住所收货、本人确认、核验真伪或认证号、报价、付款并记台账。怀疑不正品则停手并向警察申告。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1f2328}.muted{fill:#57606a}</style>
<rect width="600" height="250" fill="#f6f8fa"/>
<text x="24" y="28" font-size="16" font-weight="700">收购流程：确认和核验，都在付款之前</text>
<text x="24" y="48" font-size="11" class="muted">After the license is issued. Receive goods only at the shop or the seller’s address. Stop if the item looks illicit.</text>
<g font-size="11">
  <rect x="24" y="64" width="88" height="118" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="68" y="96" text-anchor="middle" font-weight="700">1 收货地点</text>
  <text x="68" y="118" text-anchor="middle">营业所或</text>
  <text x="68" y="134" text-anchor="middle">对方住所</text>
  <rect x="120" y="64" width="88" height="118" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="164" y="96" text-anchor="middle" font-weight="700">2 本人确认</text>
  <text x="164" y="118" text-anchor="middle">住所姓名</text>
  <text x="164" y="134" text-anchor="middle">职业年龄</text>
  <rect x="216" y="64" width="88" height="118" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="260" y="96" text-anchor="middle" font-weight="700">3 核验</text>
  <text x="260" y="118" text-anchor="middle">认证号</text>
  <text x="260" y="134" text-anchor="middle">或成色真伪</text>
  <rect x="312" y="64" width="88" height="118" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="356" y="96" text-anchor="middle" font-weight="700">4 报价</text>
  <text x="356" y="118" text-anchor="middle">按收购定价</text>
  <text x="356" y="134" text-anchor="middle">客人可拒绝</text>
  <rect x="408" y="64" width="80" height="118" rx="8" fill="#fff" stroke="#0b5cad"/>
  <text x="448" y="96" text-anchor="middle" font-weight="700">5 付款</text>
  <text x="448" y="118" text-anchor="middle">并记台账</text>
  <text x="448" y="134" text-anchor="middle">保存三年</text>
  <rect x="496" y="64" width="80" height="118" rx="8" fill="#fff" stroke="#b3001b"/>
  <text x="536" y="96" text-anchor="middle" font-weight="700">异常</text>
  <text x="536" y="118" text-anchor="middle">先停手</text>
  <text x="536" y="134" text-anchor="middle">立即申告</text>
</g>
<text x="24" y="214" font-size="12">许可下来之前，不要以古物商身份开展买取。示意图，不是官方流程表。</text>
<text x="24" y="234" font-size="11" class="muted">Details: Antique Business Act Arts. 14–16. Follow the local police station’s latest guidance.</text>
</svg>
