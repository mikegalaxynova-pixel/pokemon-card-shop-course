<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif">
<title id="t">广岛市卡店盗窃案：时间线</title><desc id="d">据テレビ新広島（FNN）2026-11-20、中国新聞 2026-11-18 报道</desc>
<rect width="640" height="260" fill="#fff"/>
<text x="24" y="26" font-size="16" font-weight="700" fill="#121212">广岛市卡店盗窃案：时间线</text>
<text x="24" y="46" font-size="12" fill="#646464">据テレビ新広島（FNN）2026-11-20、中国新聞 2026-11-18 报道</text>
<line x1="60" y1="130" x2="580" y2="130" stroke="#b3001b" stroke-width="3"/>
<circle cx="60.0" cy="130" r="7" fill="#b3001b"/>
<text x="50.0" y="110" font-size="13" font-weight="700" fill="#121212" text-anchor="start">6/16</text>
<text x="50.0" y="160" font-size="12" font-weight="700" fill="#121212" text-anchor="start">先偷原付摩托和头盔</text>
<text x="50.0" y="178" font-size="11.5" font-weight="400" fill="#646464" text-anchor="start">（警方认定）</text>
<circle cx="320.0" cy="130" r="7" fill="#b3001b"/>
<text x="320.0" y="110" font-size="13" font-weight="700" fill="#121212" text-anchor="middle">6/17</text>
<text x="320.0" y="160" font-size="12" font-weight="700" fill="#121212" text-anchor="middle">闯入广岛市中区卡店</text>
<text x="320.0" y="178" font-size="11.5" font-weight="400" fill="#646464" text-anchor="middle">盗走宝可梦卡等 10 箱</text>
<text x="320.0" y="196" font-size="11.5" font-weight="400" fill="#646464" text-anchor="middle">约 109 万日元</text>
<circle cx="580.0" cy="130" r="7" fill="#b3001b"/>
<text x="590.0" y="110" font-size="13" font-weight="700" fill="#121212" text-anchor="end">11/18</text>
<text x="590.0" y="160" font-size="12" font-weight="700" fill="#121212" text-anchor="end">18 岁男子被捕</text>
<text x="590.0" y="178" font-size="11.5" font-weight="400" fill="#646464" text-anchor="end">监控「接力追查」锁定</text>
<text x="590.0" y="196" font-size="11.5" font-weight="400" fill="#646464" text-anchor="end">本人承认</text>
<text x="24" y="246" font-size="11" fill="#646464">本站制图。报道未提被盗商品是否追回、店名未公开。</text></svg>
