<title id="t">30th CELEBRATION 三张卡：一周内 PSA 10 枚数大增、PSA 10 成交中位价回落</title>
<desc id="d">数据来自トレギャラ 11/6〜11/12 周报：リザードン 137/103 PSA10 枚数 92→252，中位价 14.9万→13.7万日元；ピカチュウex SAR 127/103 枚数 64→278，80,000→75,000日元；ミュウex FUR 135/103 枚数 117→292，70,999→68,500日元。本图是数据示意图，不是行情预测。</desc>
