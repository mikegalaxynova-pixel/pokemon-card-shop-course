<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="t d">
<title id="t">规则标记与稀有度的区别示意图</title>
<desc id="d">卡片底部一排标记的示意图：圆圈里的字母是规则标记，用来辅助判断时期，不是稀有度；后面的 C、R、RR、SAR 等字母才是稀有度。</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#1f2328}
  .muted{fill:#57606a}
  .w{fill:#fff}
  .accent{fill:#b3001b}
</style>

<rect width="600" height="260" fill="#f6f8fa"/>
<text x="24" y="32" font-size="16" font-weight="700">别把规则标记当成稀有度</text>
<text x="24" y="52" font-size="12" class="muted">Regulation Mark is not rarity</text>
<rect x="24" y="70" width="552" height="100" rx="10" fill="#fff" stroke="#d0d7de"/>
<!-- fake bottom strip -->
<text x="44" y="92" font-size="10" class="muted">Illus. Example</text>
<g transform="translate(40,108)">
  <circle cx="16" cy="16" r="15" fill="#fff" stroke="#1f2328" stroke-width="2"/>
  <text x="16" y="21" font-size="16" font-weight="700" text-anchor="middle">I</text>
  <rect x="42" y="2" width="46" height="28" rx="3" fill="#1f2328"/>
  <text x="65" y="21" font-size="11" font-weight="700" text-anchor="middle" class="w">M1S</text>
  <text x="100" y="22" font-size="16" font-weight="700">038/063</text>
  <text x="190" y="22" font-size="18" font-weight="700" fill="#b3001b">R</text>
</g>
<!-- arrows -->
<text x="36" y="200" font-size="13">规则标记 Regulation</text>
<text x="36" y="218" font-size="11" class="muted">圆圈字母，判断卡的时期</text>
<text x="36" y="234" font-size="11" class="muted">不是稀有度</text>
<text x="230" y="200" font-size="13">扩展标记 Set symbol</text>
<text x="230" y="218" font-size="11" class="muted">来自哪一弹</text>
<text x="400" y="200" font-size="13">收藏编号 + <tspan fill="#b3001b" font-weight="700">稀有度</tspan></text>
<text x="400" y="218" font-size="11" class="muted">C / U / R / RR / SAR 等字母</text>
<text x="400" y="234" font-size="11" class="muted">才是 rarity</text>

</svg>
