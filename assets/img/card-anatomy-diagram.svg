<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="t d">
<title id="t">卡面位置示意图</title>
<desc id="d">一张空白卡片示意图，标出进化阶段、HP与属性、名称与招式、弱点抵抗撤退、以及底部的规则标记、扩展标记、收藏编号和稀有度位置。</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#1f2328}
  .muted{fill:#57606a}
  .w{fill:#fff}
  .accent{fill:#b3001b}
</style>

<rect width="600" height="420" fill="#f6f8fa"/>
<!-- card -->
<rect x="40" y="28" width="220" height="364" rx="14" fill="#fff" stroke="#1f2328" stroke-width="2"/>
<rect x="52" y="42" width="70" height="22" rx="4" fill="#eaeef2" stroke="#8c959f"/>
<text x="58" y="58" font-size="11">① 进化</text>
<rect x="168" y="40" width="80" height="28" rx="4" fill="#eaeef2" stroke="#8c959f"/>
<text x="176" y="58" font-size="11">② HP / 属性</text>
<rect x="62" y="80" width="176" height="110" rx="6" fill="#d0d7de"/>
<text x="150" y="140" font-size="12" text-anchor="middle" class="muted">插画</text>
<rect x="62" y="200" width="176" height="70" rx="4" fill="#fff4d6" stroke="#e3c06b"/>
<text x="150" y="232" font-size="11" text-anchor="middle">③ 名称 / 特性 / 招式</text>
<rect x="62" y="278" width="176" height="28" rx="4" fill="#eaeef2"/>
<text x="150" y="297" font-size="10" text-anchor="middle">④ 弱点 / 抵抗 / 撤退</text>
<rect x="62" y="316" width="176" height="48" rx="4" fill="#fff8f8" stroke="#b3001b"/>
<text x="150" y="337" font-size="10" text-anchor="middle">⑤ 底部标记</text>
<text x="150" y="352" font-size="9" text-anchor="middle" class="muted">规则 / 扩展 / 编号 / 稀有度</text>
<!-- labels -->
<text x="290" y="36" font-size="16" font-weight="700">卡面位置示意图</text>
<text x="290" y="58" font-size="11" class="muted">Card layout (diagram, not a real card)</text>
<text x="290" y="92" font-size="13">① 左上：进化阶段 Evolution</text>
<text x="308" y="110" font-size="12" class="muted">たね Basic / 1進化 Stage 1 / 2進化 Stage 2</text>
<text x="290" y="140" font-size="13">② 右上：HP 与属性 Type</text>
<text x="290" y="172" font-size="13">③ 中部：名称、特性、招式</text>
<text x="308" y="190" font-size="12" class="muted">Name, Ability, Attack</text>
<text x="290" y="222" font-size="13">④ 卡面下方：弱点 / 抵抗 / 撤退</text>
<text x="308" y="240" font-size="12" class="muted">Weakness, Resistance, Retreat</text>
<text x="290" y="272" font-size="13">⑤ 最底部一排（店员最该会看）</text>
<text x="308" y="290" font-size="12" class="muted">Regulation Mark, set symbol,</text>
<text x="308" y="306" font-size="12" class="muted">collector number, rarity letter</text>
<text x="290" y="350" font-size="11" class="muted">本图是位置示意，不是真实卡面。</text>
<text x="290" y="368" font-size="11" class="muted">对照右侧实物官方图一起看。</text>

</svg>
