<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
<title id="t">认证号核验四步（示意图）</title>
<desc id="d">第一步读出标签上的认证编号；第二步在 PSA 官网或 App 输入；第三步逐项对照卡名、年份系列、编号、等级和官方图片；第四步即使对上也要再看壳和标签本身，因为号码可能被复制。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1f2328}.muted{fill:#57606a}.w{fill:#fff}.lt{fill:#fde8e8}</style>
<rect width="600" height="300" fill="#f6f8fa"/>
<text x="24" y="28" font-size="16" font-weight="700">认证号核验四步</text>
<text x="24" y="48" font-size="11" class="muted">Cert verification in four steps. Study diagram, not a photo.</text>
<g>
<rect x="24" y="64" width="130" height="150" rx="10" fill="#b3001b"/>
<text x="89" y="96" font-size="20" font-weight="700" text-anchor="middle" class="w">1</text>
<text x="89" y="122" font-size="14" font-weight="700" text-anchor="middle" class="w">读号码</text>
<text x="89" y="146" font-size="11" text-anchor="middle" class="lt">标签右下的</text>
<text x="89" y="162" font-size="11" text-anchor="middle" class="lt">cert number</text>
<text x="89" y="190" font-size="11" text-anchor="middle" class="lt">（背面也有QR）</text>
</g>
<text x="160" y="144" font-size="18" fill="#b3001b">→</text>
<g>
<rect x="178" y="64" width="130" height="150" rx="10" fill="#fff" stroke="#d0d7de"/>
<text x="243" y="96" font-size="20" font-weight="700" text-anchor="middle">2</text>
<text x="243" y="122" font-size="14" font-weight="700" text-anchor="middle">官方查询</text>
<text x="243" y="146" font-size="11" text-anchor="middle" class="muted">psacard.com/cert</text>
<text x="243" y="162" font-size="11" text-anchor="middle" class="muted">或 PSA App</text>
<text x="243" y="190" font-size="11" text-anchor="middle" class="muted">别用卖家给的链接</text>
</g>
<text x="314" y="144" font-size="18" fill="#b3001b">→</text>
<g>
<rect x="332" y="64" width="130" height="150" rx="10" fill="#fff" stroke="#d0d7de"/>
<text x="397" y="96" font-size="20" font-weight="700" text-anchor="middle">3</text>
<text x="397" y="122" font-size="14" font-weight="700" text-anchor="middle">逐项对照</text>
<text x="397" y="146" font-size="11" text-anchor="middle" class="muted">卡名 · 年份/系列</text>
<text x="397" y="162" font-size="11" text-anchor="middle" class="muted">编号 · 等级</text>
<text x="397" y="178" font-size="11" text-anchor="middle" class="muted">官方图片（如有）</text>
</g>
<text x="468" y="144" font-size="18" fill="#b3001b">→</text>
<g>
<rect x="486" y="64" width="96" height="150" rx="10" fill="#fff4d6" stroke="#d4a72c"/>
<text x="534" y="96" font-size="20" font-weight="700" text-anchor="middle">4</text>
<text x="534" y="122" font-size="14" font-weight="700" text-anchor="middle">再看壳</text>
<text x="534" y="146" font-size="11" text-anchor="middle" class="muted">号码可被</text>
<text x="534" y="162" font-size="11" text-anchor="middle" class="muted">复制到假标</text>
<text x="534" y="178" font-size="11" text-anchor="middle" class="muted">见检查点图</text>
</g>
<rect x="24" y="230" width="558" height="50" rx="8" fill="#fff" stroke="#d0d7de"/>
<text x="38" y="252" font-size="12" font-weight="700">PSA 官方提醒：证明番号の確認は偽造リスクを排除するものではありません。</text>
<text x="38" y="270" font-size="11" class="muted">查得到号码 ≠ 一定是真壳；查不到或信息对不上 = 不收、不上架，先停下。</text>
</svg>
