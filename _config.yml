title: 宝可梦卡牌店实战课
description: 给准备在东京开 PSA 评级卡店的新手：先看今天更新了什么、下一步该做什么。新闻、店铺案例和视频分开更新。
lang: zh-CN
locale: zh_CN
url: https://mikegalaxynova-pixel.github.io
baseurl: /pokemon-card-shop-course
timezone: Asia/Tokyo
future: true
new_badge_days: 2
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: /daily/:year-:month-:day/
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
feed:
  path: feed.xml
collections:
  kb:
    output: true
    permalink: /kb/:path/
  shops:
    output: true
    permalink: /shops/:name/
  videos:
    output: true
    permalink: /videos/:name/
  research:
    output: true
    permalink: /research/:name/
defaults:
  - scope: { path: "", type: kb }
    values: { layout: kb, nav: kb }
  - scope: { path: "", type: shops }
    values: { layout: shop, nav: shops }
  - scope: { path: "", type: research }
    values: { layout: research, nav: research }
  - scope: { path: "", type: videos }
    values: { layout: video, nav: videos }
  - scope: { path: "", type: posts }
    values: { layout: daily, nav: news }
  - scope: { path: "" }
    values: { layout: page }
exclude:
  - README.md
  - CONTRIBUTING.md
  - ROADMAP.md
  - Gemfile
  - Gemfile.lock
  - vendor
