title: 宝可梦卡牌店实战课
description: 面向准备在东京高田马场开 PSA 评级卡实体店的新手：每日更新新闻、视频推荐与店铺案例，并围绕更快走到收支平衡给建议。
lang: zh-CN
locale: zh_CN
url: https://mikegalaxynova-pixel.github.io
baseurl: /pokemon-card-shop-course
timezone: Asia/Tokyo
future: true
new_badge_days: 2
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: /daily/:year-:month-:day/
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
feed:
  path: feed.xml
collections:
  kb:
    output: true
    permalink: /kb/:path/
defaults:
  - scope: { path: "", type: kb }
    values: { layout: kb }
  - scope: { path: "", type: posts }
    values: { layout: daily }
  - scope: { path: "" }
    values: { layout: page }
exclude:
  - README.md
  - CONTRIBUTING.md
  - ROADMAP.md
  - Gemfile
  - Gemfile.lock
  - vendor
