  - { section: buy, slug: buy-pricing }
  - { section: buy, slug: high-value-trades }
  - { section: shop, slug: shop-events }
  - { section: cards, slug: condition }

weeks:
  - { n: 1, title: "卡牌基础与 PSA 评级", range: "已大部分发布", goal: "看懂一张卡、系列与稀有度、日英版差异、PSA 等级与 Pop、认证号与假壳。" }
