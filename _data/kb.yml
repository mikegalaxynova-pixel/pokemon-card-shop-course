# 基础知识目录（唯一数据源）。status: published | planned。published 必须有对应 _kb/<section>/<slug>.md。
# planned 文章改为按需撰写，不再按日期每晚自动写。recommended: true 表示每日更新会优先推荐。
# priority_path：建议优先的阅读顺序（开业准备到回本）。已发布条目仍保留 recommended: true，供本列表展示。
priority_path:
