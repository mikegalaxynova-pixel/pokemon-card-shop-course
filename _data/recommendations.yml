- id: yt-special-deck-set-mega
  type: video
  title: 『【ポケカ新商品】スペシャルデッキセットだって～～～～！？【ポケモンカード】』
  creator: 【公式】ポケモンカードチャンネル
  url: https://www.youtube.com/watch?v=8MdwGqVOoP0
  note: 官方介绍 11/13 上市的「スペシャルデッキセットMEGA」：三套固定内容商品各收录哪些角色卡、附赠什么配件，便于对照定价和后续单卡收藏需求。
  comment: >
    官方频道的商品介绍，内容可信，值得花几分钟看完，但不必当成「必进货」清单。主卖 PSA 的店看它，是为了搞清三套分别收录哪些角色、附赠什么配件，以后客人问起或出现相关单卡询价时能对得上；视频本身不构成现在就备货的理由。下一步：看完后只记下三套的角色线和附件，发售后再对照有没有单卡收藏需求，不要在视频里寻找组卡或对战信息。
  tags: [官方, 新商品, 日语]
  added: 2026-11-14
- id: snkrdunk
  type: tool
  title: SNKRDUNK（スニダン）
  url: https://snkrdunk.com/
  note: 看日文卡（含部分评级卡）在日本的近期成交和挂牌。成交价不是你的自动售价，还要算成色、手续费和利润。
  comment: >
    查日本市场近期成交，这是目前最该先会用的工具，重要程度很高。西新宿店给 PSA 卡和二手单卡标价，应当从这里看国内行情，但成交价不能直接写成货架价：还要扣成色差异、手续费和你需要的利润，也不能只看一笔就下结论。下一步：先用朋友那批库存里的 2〜3 张，练习对照近期成交，养成「先查再标」的习惯。
  tags: [查价, 日本市场]
  added: 2026-11-14
- id: pricecharting
  type: tool
  title: PriceCharting
  url: https://www.pricecharting.com/category/pokemon-cards
  note: 主要追踪国际成交，按未评级、PSA 等级给价格曲线。接待海外客人和日英比价时有用，注意选对语言和套装。
  comment: >
    国际成交和按 PSA 等级拆开的曲线，对接待游客、做日英比价很有用，但代替不了 SNKRDUNK 上的日本行情。选错语言或套装会看错价格，这是最常见的风险。下一步：等库存表里有明确的日文卡和对应英文版时，再过来对照，不要单独用它给日本店头定价。
  tags: [查价, 海外市场, PSA]
  added: 2026-11-14
- id: psa-pop
  type: tool
  title: PSA Population Report
  url: https://www.psacard.com/pop
  note: 查某张卡被评为各等级的数量，判断 10 分是否稀缺。
  comment: >
    这是 PSA 官方的鉴定数量，判断「10 分是否稀缺」时应当看这里，可信度高。但它只说明评出了多少张，不能单独决定售价：需求、角色和成色同样重要，Pop 低不等于一定能卖高价。下一步：给库存里几张 PSA 10 和同卡 PSA 9 都查一遍 Pop，体会一下等级差和稀缺是怎么同时出现的。
  tags: [PSA, Pop]
  added: 2026-11-14
- id: psa-cert
  type: tool
  title: PSA 官网（认证编号查询）
  url: https://www.psacard.com/
  note: 盘点库存的「身份证系统」：先核认证编号真伪，再看等级与 Pop。
  comment: >
    主卖 PSA 的店，这是进货和上架前的第一步，重要性高于查价：认证号对不上，后面的等级和价格都没有意义。西新宿店面对的是朋友提供的一批现货，先核验能降低假壳风险，也是对客人最基本的负责。下一步：先抽 2〜3 张核对认证号，再决定要不要把核验当作每张卡入库的固定动作。
  tags: [PSA, 认证号, 防伪]
  added: 2026-11-14
- id: psa-grading-standards
  type: site
  title: PSA Grading Standards
  url: https://www.psacard.com/gradingstandards
  note: PSA 官方等级标准原文，向客人解释等级前先核对这里。
  comment: >
    向客人解释「为什么是 10 分或 9 分」时，应当以官方标准为准，不要靠记忆或论坛说法。店头讲错等级标准，比标价略保守更伤信任。下一步：先把 10 分和 9 分的原文标准读一遍，再对照手边的壳，练习用官方用语回答客人。
  tags: [PSA, 等级, 官方]
  added: 2026-11-14
- id: pokemon-card-official
  type: site
  title: 宝可梦卡牌官网（ポケモンカードゲーム公式）
  url: https://www.pokemon-card.com/
  note: 新商品、收录卡、发售日的第一手来源，新闻和商品确认以这里为准。
  comment: >
    确认发售日、收录卡和希望零售价，应当回到这个官网，重要性和可信度都最高；媒体和社交转述只作为线索。店里回答「哪天出、一包多少钱、有哪张 SAR」时，以这里为准，可以避免把未证实的箱规或转售价说成事实。下一步：把「ハドウシーカー」和「スペシャルデッキセットMEGA」的商品页收进书签，有新收录再对照更新备忘。
  tags: [官方, 新商品]
  added: 2026-11-14
- id: x-pokemon-cojp
  type: account
  title: "@pokemon_cojp（ポケモン公式 X）"
  url: https://x.com/pokemon_cojp
  note: 官方 X 账号，发售、活动等消息确认渠道之一。
  comment: >
    官方账号适合用来追上新消息，但不是唯一依据，细节仍要回到官网商品页。信息密度高，和开店无关的内容会很多，不必条条都跟。下一步：先关注，遇到发售或新品信息再点回官网核对；和收藏、评级卡无关的对战或活动消息可以略过。
