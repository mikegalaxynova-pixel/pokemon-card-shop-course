- id: yt-30th-futuristic
  type: video
  title: 『【公式】ポケモンカードゲーム 30周年記念商品コンセプト映像「What's FUTURISTIC?」』
  creator: ポケモン公式YouTubeチャンネル
  url: https://www.youtube.com/watch?v=xVablhq1Cfk
  note: 官方概念影像，介绍 30 周年扩展包「30th CELEBRATION」的新稀有度 FUR（Futuristic Rare，暂译；官方英文商品名已使用 30th Celebration）以及与艺术家 YOSHIROTTEN 的合作。用来认识客人仍可能问起的周年包和特殊稀有度，不是开箱或对战视频。
  comment: >
    官方一手影像，可信度高，但讲的是已经上市的周年包设计和稀有度，不会告诉你现在该不该进货。
    对高田马场 PSA 店的意义是：客人问起 FUR、ミュウ ex（Mew ex）、ミュウツー ex（Mewtwo ex）时，店员要能对上名称和「这是 30 周年包的特殊稀有度」，而不是据此去追二级市场盒子。
    建议先不做：不要因为看了概念片就补货「30th CELEBRATION」盒子。建议做：记下 FUR 和两张主打卡的英文名，方便接待。对回本几乎没有直接加分，也几乎不增加成本，优先级别低。
  tags: [官方, 30周年, 稀有度, 日语]
  added: 2026-11-15
- id: yt-neet-psa-new-plan
  type: video
  title: 『PSA新プラン登場！が正直渋いです。今PSA出すべきカードをカードショップオーナーが解説』
  creator: 貧乏すぎたポケカ投資家　ニートポケモン
  url: https://www.youtube.com/watch?v=7aWExr5oHD8
  note: 2026-11-14（JST）公开、约 6 分钟。频道主在说明栏中写明自己经营横滨的卡店「トレカトップ」（做 PSA 与裸卡收购），视频按标题是从卡店经营者角度谈 PSA 新方案和「现在该送评哪些卡」。说明栏里也有自家网店、オリパ（原创福袋）等宣传链接。
  comment: >
    同行卡店老板的视角，对你很有参考价值，但它是个人观点加自家宣传，可信度中等：涉及费用、等级和交期的说法，一律以 PSA Japan 官网为准（本期新闻已列出转壳新价）。
    对高田马场这家主卖 PSA 的店，看点是「卡店怎么判断一张卡值不值得送评」以及收购 PSA 卡时的思路；不要照搬他的「该出哪些卡」清单，那是他的库存和客群。
    下一步：看完写下他提到的判断标准（如价差、交期、费用），对照本站的 PSA 文章，下周讲送评流程时再核一次。
  tags: [PSA, 送评, 卡店经营, 日语]
  added: 2026-11-14
