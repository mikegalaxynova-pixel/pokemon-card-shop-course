<!DOCTYPE html>
<html lang="zh-CN" class="feed-html" data-sw="{{ '/sw.js' | relative_url }}" data-sw-scope="{{ '/' | relative_url }}" data-home="{{ '/' | relative_url }}" data-nav="{{ page.nav | default: layout.nav }}"{% unless page.nav == "home" or page.url == "/404.html" %} data-paneable="1"{% endunless %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d6001c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="卡牌店课">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/icons/pokeball-180.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/pokeball-32.png' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/icons/pokeball.svg' | relative_url }}">
<script>
(function(){try{var t=localStorage.getItem("pcsc-theme");if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);var c=t==="dark"?"#121212":"#d6001c";var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",c);}catch(e){}})();
</script>
<script>{% include panes-head.js %}</script>
{% seo %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} 新闻" href="{{ '/feed.xml' | relative_url }}">
<style>{% include style.css %}</style>
<style>{% include feed.css %}</style>
<style>
.site-subnav .feed-tab{display:inline-flex;align-items:center;text-decoration:none;color:var(--feed-muted)}
.site-subnav .feed-tab[aria-current=page]{color:var(--feed-fg);font-weight:700;border-bottom-color:var(--feed-fg)}
</style>
</head>
<body class="feed-home">
<a class="skip" href="#main">跳到正文</a>
<div class="feed-shell">
{% include site-header.html %}
<main id="main" class="{% if page.nav == 'home' %}feed-main{% else %}page-main{% endif %}">
{% if page.collection %}
  <nav class="page-back" aria-label="返回">
    <a id="page-back" class="page-back-link" href="{% if page.collection == 'posts' %}{{ '/news/' | relative_url }}{% elsif page.collection == 'videos' %}{{ '/videos/' | relative_url }}{% elsif page.collection == 'shops' %}{{ '/shops/' | relative_url }}{% elsif page.collection == 'kb' %}{{ '/kb/' | relative_url }}{% elsif page.collection == 'cardlab' %}{{ '/cardlab/' | relative_url }}{% elsif page.collection == 'research' %}{{ '/research/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">返回</a>
    <a href="{{ '/' | relative_url }}">今日</a>
  </nav>
{% endif %}
{{ content }}
</main>
<button type="button" class="back-to-top" id="back-to-top" hidden aria-label="回到顶部">顶部</button>
<footer class="site-footer">
  <div class="wrap">
    <nav class="foot-nav" aria-label="其他页面">
      <a href="{{ '/cardlab/' | relative_url }}">名卡研究</a>
      <a href="{{ '/news/' | relative_url }}">新闻归档</a>
      <a href="{{ '/kb/' | relative_url }}">基础知识</a>
      <a href="{{ '/shops/' | relative_url }}">店铺案例</a>
      <a href="{{ '/research/' | relative_url }}">调研</a>
      <a href="{{ '/videos/' | relative_url }}">视频</a>
      <a href="{{ '/tools/' | relative_url }}">工具</a>
      <a href="{{ '/breakeven/' | relative_url }}">收支平衡路线图</a>
      <a href="{{ '/glossary/' | relative_url }}">术语表</a>
      <a href="{{ '/search/' | relative_url }}">搜索</a>
      <a href="{{ '/changelog/' | relative_url }}">更新日志</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
    <p class="muted">内容为学习整理，法规与价格以官方和主管机关最新信息为准。宝可梦相关名称归其权利人所有，本站为非官方学习笔记。</p>
  </div>
</footer>
</div>
{% include yt-modal.html %}
<script>{% include read.js %}</script>
<script>{% include news-filter.js %}</script>
<script>{% include video-player.js %}</script>
<script>{% include theme.js %}</script>
<script>{% include site-ux.js %}</script>
{% if page.nav == "home" %}<script>{% include feed.js %}</script>{% endif %}
<script>{% include panes.js %}</script>
</body>
</html>
