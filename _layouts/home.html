<!DOCTYPE html>
<html lang="zh-CN" class="feed-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b3001b">
<script>
(function(){try{var t=localStorage.getItem("pcsc-theme");if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);var c=t==="dark"?"#121212":"#ffffff";var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",c);}catch(e){}})();
</script>
{% seo %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} 新闻" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%23222' stroke-width='8'/%3E%3Cpath d='M4 50h92' stroke='%23222' stroke-width='8'/%3E%3Cpath d='M8 46A42 42 0 0 1 92 46Z' fill='%23d6001c'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%23fff' stroke='%23222' stroke-width='8'/%3E%3C/svg%3E">
<style>{% include style.css %}</style>
<style>{% include feed.css %}</style>
</head>
<body class="feed-home">
<a class="skip" href="#main">跳到正文</a>
<div class="feed-shell">
<header class="feed-header">
  <div class="feed-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <form class="head-search" role="search" action="{{ '/search/' | relative_url }}" method="get">
      <label class="sr" for="feed-search">搜索本站内容</label>
      <input id="feed-search" type="search" name="q" placeholder="搜索新闻、案例、视频和文章" autocomplete="off">
    </form>
    <button type="button" class="theme-btn" id="theme-toggle" aria-label="切换深浅色" data-theme-now="light">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18"/></svg>
    </button>
    <a class="head-tools" href="{{ '/tools/' | relative_url }}">工具</a>
  </div>
</header>
<main id="main" class="feed-main">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <nav class="foot-nav" aria-label="其他页面">
      <a href="{{ '/tools/' | relative_url }}">工具</a>
      <a href="{{ '/breakeven/' | relative_url }}">收支平衡路线图</a>
      <a href="{{ '/glossary/' | relative_url }}">术语表</a>
      <a href="{{ '/search/' | relative_url }}">搜索</a>
      <a href="{{ '/changelog/' | relative_url }}">更新日志</a>
      <a href="{{ '/news/' | relative_url }}">新闻归档</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
    <p class="muted">内容为学习整理，法规与价格以官方和主管机关最新信息为准。宝可梦相关名称归其权利人所有，本站为非官方学习笔记。</p>
  </div>
</footer>
</div>
<script>{% include read.js %}</script>
<script>{% include feed.js %}</script>
</body>
</html>
